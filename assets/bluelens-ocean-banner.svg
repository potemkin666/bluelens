<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">BlueLens ocean banner</title>
  <desc id="desc">Gradient blue ocean-styled BlueLens banner for the repository README.</desc>
  <defs>
    <linearGradient id="bg" x1="86" y1="28" x2="1112" y2="292" gradientUnits="userSpaceOnUse">
      <stop stop-color="#031225"/>

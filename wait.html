<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OSINT Lens &mdash; Waiting</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: system-ui, Segoe UI, Roboto, Arial, sans-serif;
        background: #05142d;
        color: #eaf7ff;
      }
      .wrap {
        display: grid;
        place-items: center;
        height: 100%;
        padding: 24px;
      }
      .card {
        max-width: 720px;
        width: 100%;
        border: 1px solid rgba(230, 251, 255, 0.25);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.06);
        padding: 18px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }
      .muted {
        opacity: 0.8;
      }
      a {
        color: #d9fbff;
        text-decoration: none;
        border-bottom: 1px dashed rgba(230, 251, 255, 0.55);
      }
      button {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 14px;
        border: 1px solid rgba(230, 251, 255, 0.35);
        background: rgba(255, 255, 255, 0.08);
        color: #eaf7ff;
        cursor: pointer;
      }
      .spinner {
        width: 12px;
        height: 12px;
        border-radius: 999px;
        border: 2px solid rgba(234, 247, 255, 0.25);
        border-top-color: rgba(234, 247, 255, 0.9);
        display: inline-block;
        vertical-align: -2px;
        margin-right: 10px;
        animation: spin 700ms linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div id="title"><strong>Engine</strong> &mdash; waiting for public image URL&hellip;</div>
        <div id="msg" class="muted" style="margin-top: 8px"><span class="spinner" aria-hidden="true"></span>Keep this tab open.</div>
        <div id="link" style="margin-top: 10px"></div>
        <button id="close">Close</button>
      </div>
    </div>
    <script src="./wait.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OSINT Lens &mdash; Waiting</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: system-ui, Segoe UI, Roboto, Arial, sans-serif;
        background:
          radial-gradient(960px 640px at 18% 12%, rgba(220, 248, 255, 0.18), transparent 58%),
          radial-gradient(900px 700px at 82% 16%, rgba(114, 198, 255, 0.18), transparent 60%),
          linear-gradient(180deg, #041327, #071d3b 65%, #05142d);
        color: #eaf7ff;
      }
      .wrap {
        display: grid;
        place-items: center;
        height: 100%;
        padding: 24px;
      }
      .card {
        max-width: 720px;
        width: 100%;
        border: 1px solid rgba(230, 251, 255, 0.28);
        border-radius: 22px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.06)),
          linear-gradient(180deg, rgba(10, 34, 68, 0.56), rgba(6, 20, 44, 0.3));
        padding: 18px;
        box-shadow:
          0 28px 90px rgba(0, 10, 30, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(18px) saturate(1.16);
        -webkit-backdrop-filter: blur(18px) saturate(1.16);
      }
      .muted {
        opacity: 0.8;
      }
      a {
        color: #d9fbff;
        text-decoration: none;
        border-bottom: 1px dashed rgba(230, 251, 255, 0.55);
      }
      button {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 14px;
        border: 1px solid rgba(230, 251, 255, 0.35);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.06)),
          rgba(255, 255, 255, 0.04);
        color: #eaf7ff;
        cursor: pointer;
      }
      .spinner {
        position: relative;
        width: 14px;
        height: 14px;
        display: inline-block;
        vertical-align: -2px;
        margin-right: 10px;
      }
      .spinner::before,
      .spinner::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 999px;
        border: 1px solid rgba(196, 242, 255, 0.4);
        box-shadow: 0 0 22px rgba(167, 236, 255, 0.18);
        animation: ripple 1.6s ease-out infinite;
      }
      .spinner::before {
        background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0 22%, rgba(166, 236, 255, 0.88) 42%, transparent 75%);
      }
      .spinner::after {
        animation-delay: 0.45s;
      }
      @keyframes ripple {
        0% {
          transform: scale(0.42);
          opacity: 0.95;
        }
        100% {
          transform: scale(2.5);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div id="title"><strong>Engine</strong> &mdash; waiting for public image URL&hellip;</div>
        <div id="msg" class="muted" style="margin-top: 8px" aria-live="polite"></div>
        <div id="link" style="margin-top: 10px"></div>
        <div id="recovery" class="muted" style="margin-top: 10px" hidden></div>
        <button id="close">Close</button>
      </div>
    </div>

    <script src="./bluelens-config.js"></script>
    <script>
      const runtimeConfig = window.BLUELENS_CONFIG || {};
      const waitJobTimeoutMs = runtimeConfig?.server?.waitJobs?.defaultTimeoutMs || 25000;
      const waitPageConfig = runtimeConfig?.app?.waitPage || {};
      const initialRetryMs = waitPageConfig.initialRetryMs || 350;
      const maxRetryMs = waitPageConfig.maxRetryMs || 5000;
      const backoffFactor = waitPageConfig.backoffFactor || 1.8;
      const missingJobTerminalMs = waitPageConfig.missingJobTerminalMs || 12000;
      const stalledJobTerminalMs = waitPageConfig.stalledJobTerminalMs || 45000;
      const waitDiagnostics = new Map();
      const params = new URLSearchParams(location.search);
      const jobId = params.get("job") || "";
      let engine = params.get("engine") || "";
      let label = params.get("label") || engine || "Engine";
      let lastSeq = -1;
      let stopped = false;
      let retryMs = initialRetryMs;
      let firstSeenServerStartedAt = null;
      let lastProgressAt = Date.now();
      let missingSince = 0;

      const title = document.getElementById("title");
      const msg = document.getElementById("msg");
      const link = document.getElementById("link");
      const recovery = document.getElementById("recovery");

      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const reportWaitIssue = (scope, error, dedupeMs = 4000) => {
        const msg = error?.message || String(error || "unknown error");
        const key = `${scope}:${msg}`;
        const now = Date.now();
        const last = Number(waitDiagnostics.get(key) || 0);
        if (now - last < dedupeMs) return;
        waitDiagnostics.set(key, now);
        if (waitDiagnostics.size > 100) {
          const oldestKey = waitDiagnostics.keys().next().value;
          if (oldestKey) waitDiagnostics.delete(oldestKey);
        }
        try {
          console.info(`[BlueLens:wait.${scope}] ${msg}`);
        } catch {
          // ignore
        }
      };

      const setHeading = (nextLabel) => {
        title.textContent = "";
        const strong = document.createElement("strong");
        strong.textContent = nextLabel;
        title.appendChild(strong);
        title.append(" — waiting for public image URL…");
        document.title = `OSINT Lens - ${nextLabel}`;
      };

      const setMessage = (text, busy = false) => {
        msg.textContent = "";
        if (busy) {
          const spinner = document.createElement("span");
          spinner.className = "spinner";
          spinner.setAttribute("aria-hidden", "true");
          msg.appendChild(spinner);
        }
        msg.append(text);
      };

      const setRecovery = (text) => {
        if (!recovery) return;
        recovery.hidden = false;
        recovery.innerHTML = "";
        recovery.append(text);
        recovery.append(" ");
        const a = document.createElement("a");
        a.href = "./index.html";
        a.target = "_blank";
        a.rel = "noreferrer";
        a.textContent = "Open main tab";
        recovery.appendChild(a);
      };

      const stopWithRecovery = (text) => {
        stopped = true;
        setMessage(text);
        setRecovery("If the handoff died with a restart or expired upload state, reopen from the main tab and launch again.");
      };

      const applyMeta = (meta) => {
        const serverStartedAt = Number(meta?.server_started_at || 0);
        if (!Number.isFinite(serverStartedAt) || serverStartedAt <= 0) return;
        if (firstSeenServerStartedAt == null) {
          firstSeenServerStartedAt = serverStartedAt;
          return;
        }
        if (serverStartedAt !== firstSeenServerStartedAt) {
          stopWithRecovery("Local handoff server restarted before this wait tab finished.");
        }
      };

      setHeading(label);
      setMessage("Connecting to local handoff…", true);

      document.getElementById("close").addEventListener("click", () => window.close());

      const buildTarget = (u) => {
        const enc = encodeURIComponent(u);
        switch (engine) {
          case "lens":
            return `https://lens.google.com/uploadbyurl?url=${enc}`;
          case "bing":
            return `https://www.bing.com/images/search?q=imgurl:${enc}&view=detailv2&iss=sbi`;
          case "tineye":
            return `https://tineye.com/search?url=${enc}`;
          case "yandex":
            return `https://yandex.com/images/search?rpt=imageview&url=${enc}`;
          default:
            return `https://www.google.com/searchbyimage?image_url=${enc}`;
        }
      };

      const applyJob = (job) => {
        if (!job) return false;
        if (job.label) {
          label = job.label;
          setHeading(label);
        }
        if (job.engine) engine = job.engine;
        if (typeof job.seq === "number" && job.seq > lastSeq) {
          lastSeq = job.seq;
          lastProgressAt = Date.now();
        }

        if (job.err) {
          setMessage(`Error: ${job.err}`);
          stopped = true;
          return true;
        }
        if (job.url) {
          const target = buildTarget(job.url);
          link.textContent = "";
          const a = document.createElement("a");
          a.href = target;
          a.textContent = "Open manually";
          link.appendChild(a);
          location.replace(target);
          stopped = true;
          return true;
        }
        if (job.status) {
          const remainingMs = Number(job.expires_at || 0) - Date.now();
          const expiryNote =
            Number.isFinite(remainingMs) && remainingMs > 0 && remainingMs < 60_000
              ? ` Expires in ${Math.max(1, Math.ceil(remainingMs / 1000))}s.`
              : "";
          setMessage(job.status === "uploading" ? `Uploading… (check main tab).${expiryNote}` : `${String(job.status)}${expiryNote}`, true);
        }
        return false;
      };

      const watchJob = async () => {
        if (!jobId) {
          setMessage("Missing wait job ID.");
          return;
        }

        while (!stopped) {
          try {
            const r = await fetch(
              `/api/wait-jobs/${encodeURIComponent(jobId)}?since=${encodeURIComponent(lastSeq)}&timeout=${encodeURIComponent(waitJobTimeoutMs)}`,
              { cache: "no-store" },
            );
            if (!r.ok) {
              if (r.status === 404) {
                reportWaitIssue("not-found", new Error("wait job not yet created"));
                missingSince ||= Date.now();
                if (Date.now() - missingSince >= missingJobTerminalMs) {
                  stopWithRecovery("Local handoff never appeared. The server may have restarted before the wait state was published.");
                  return;
                }
                retryMs = Math.min(maxRetryMs, Math.round(retryMs * backoffFactor));
                setMessage(`Waiting for local handoff… retrying in ${(retryMs / 1000).toFixed(1)}s.`, true);
                await sleep(retryMs);
                continue;
              }
              throw new Error(`HTTP ${r.status}`);
            }
            const data = await r.json();
            applyMeta(data?.meta);
            if (stopped) return;
            retryMs = initialRetryMs;
            if (data?.missing) missingSince ||= Date.now();
            else missingSince = 0;
            if (applyJob(data?.job)) return;
            if (data?.missing && Date.now() - missingSince >= missingJobTerminalMs) {
              stopWithRecovery("The handoff state disappeared before the upload finished.");
              return;
            }
            if (Date.now() - lastProgressAt >= stalledJobTerminalMs) {
              stopWithRecovery("The wait tab stopped receiving handoff progress updates.");
              return;
            }
            if (data?.timeout) {
              retryMs = Math.min(maxRetryMs, Math.round(retryMs * backoffFactor));
              setMessage(`Still waiting for the upload job… retrying in ${(retryMs / 1000).toFixed(1)}s.`, true);
              await sleep(retryMs);
            }
          } catch (error) {
            reportWaitIssue("poll", error);
            retryMs = Math.min(maxRetryMs, Math.round(retryMs * backoffFactor));
            if (Date.now() - lastProgressAt >= stalledJobTerminalMs) {
              stopWithRecovery("Connection to the local handoff stayed down too long.");
              return;
            }
            setMessage(`Connection lost. Reconnecting in ${(retryMs / 1000).toFixed(1)}s…`, true);
            await sleep(retryMs);
          }
        }
      };

      void watchJob();
    </script>
  </body>
</html>
